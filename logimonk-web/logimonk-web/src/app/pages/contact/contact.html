<section class="wrap narrow">
  <div class="eyebrow">Contact</div>
  <h1>Talk to an expert</h1>
  <p class="lead">Tell us what you want to build and we will get back within one business day.</p>

  @if (sent()) {
    <div class="card ok">Thanks! We received your message and will be in touch shortly.</div>
  } @else {
    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label>Name<input formControlName="name" autocomplete="name"></label>
      <label>Work email<input type="email" formControlName="email" autocomplete="email"></label>
      <label>What do you want to build?<textarea rows="5" formControlName="message"></textarea></label>
      @if (form.invalid && form.touched) { <p class="err">Please fill in all fields with a valid email.</p> }
      <button class="btn" type="submit">Send message</button>
    </form>
  }
</section>
