<section class="wrap">
  <div class="eyebrow">Portfolio</div>
  <h1>Results that speak for themselves</h1>
  <div class="grid">
    @for (c of cases; track c.client) {
      <div class="card">
        <div class="stat">{{ c.stat }}</div>
        <small>{{ c.label }}</small>
        <h3>{{ c.client }}</h3>
        <p>{{ c.text }}</p>
      </div>
    }
  </div>
</section>
